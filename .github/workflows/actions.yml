# ─────────────────────────────────────────────
# GitHub Actions Workflow
# Runs on every push or pull request to main
# Steps: Validate → Build → Push to AWS ECR
# ─────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ── Variables & Secrets used in this workflow ──────────────────────────────
# GitHub Variables  (Settings → Secrets and variables → Variables):
#   AWS_REGION        e.g.  us-east-1
#   ECR_REPOSITORY    e.g.  mlops-course-labs
#
# GitHub Secrets  (Settings → Secrets and variables → Secrets):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# ──────────────────────────────────────────────────────────────────────────

jobs:

  # ── JOB 1: Validate (lint + tests) ───────────────────────────────────────
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repo code onto the runner machine
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install uv (same package manager you use locally)
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"

      # 3. Install Python using the version defined in pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      # 4. Install all project dependencies (including dev tools like ruff/pytest)
      - name: Install dependencies
        run: uv sync --frozen

      # 5. Run the linter to catch any code style issues
      - name: Lint with Ruff
        run: uv run ruff check .

      # 6. Run your tests
      - name: Run tests
        run: uv run pytest tests/ -v

  # ── JOB 2: Build & Push Docker image to AWS ECR ──────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: validate          # Only runs if the validate job passes

    # Skip this job on pull requests — only push images from main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # 1. Download your repo code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to AWS using your secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Log in to your ECR registry
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build the Docker image and push it to ECR
      #    The image is tagged with the short Git commit SHA (e.g. "a1b2c3d")
      #    so you can always trace which code is inside each image
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG \
            --tag $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:latest \
            .
          docker push $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:latest

      # 5. Print the full image URI so you can see it in the Actions log
      - name: Print image URI
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Image pushed to:"
          echo "$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG"
